name: Compila per PSP
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compila con PSPDEV
        run: docker run --rm -v "$PWD:/src" -w /src pspdev/pspdev:latest sh -c "make"
      - uses: actions/upload-artifact@v4
        with:
          name: CenereDiVelmora-EBOOT
          path: EBOOT.PBP
